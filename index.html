    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Teşhis için ücret ödüyor muyum?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Hayır, tamamen ücretsiz. Cihazını ve belirtiyi yaz; olası arızayı ve tahmini maliyeti anında öğren."
            }
          },
          {
            "@type": "Question",
            "name": "Sonuçtaki fiyat kesin mi?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Tahminidir; parça ve işçilik dahil bir aralık verir. Kesin fiyat, yerinde tespitte netleşir."
            }
          },
          {
            "@type": "Question",
            "name": "Klima hiç açılmıyor, tepki vermiyor — önce neye bakmalıyım?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Önce uzaktan kumandanın pilini değiştir; klimanın açılmama şikâyetinin en sık sebebi budur — yeni pil tak, soğutma (Cool) moduna ve düşük sıcaklığa ayarla. Sonra panodaki sigortayı ve şalteri kontrol et; taşınabilir modelde fişin prize tam oturduğuna bak, cihaz hiç enerji almıyor olabilir. Klimayı şalterden 5 dakika kapatıp yeniden açmak da koruma modunu sıfırlar. Pil, sigorta ve priz sağlamken klima hâlâ açılmıyorsa ya da iç ünite çalıştığı hâlde dış ünite hiç devreye girmiyorsa sıra marş kapasitörüne ve elektronik karta gelir — belirtiyi yaz, olası arızayı ve tahmini maliyeti ücretsiz öğren."
            }
          },
          {
            "@type": "Question",
            "name": "Bulaşık makinesi temiz yıkamıyor, tabaklar kirli çıkıyor — önce neye bakmalıyım?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Önce alt ve üst püskürtme kollarını çıkar: deliklerini kürdanla aç, takınca elinle çevirip serbestçe döndüklerinden emin ol — su bulaşığa ulaşamıyorsa en sık sebep budur. Sonra tabandaki filtreyi çıkarıp yıka, tuz ve parlatıcı haznelerini doldur; tuz bitince kireç, parlatıcı bitince leke bırakır. Bulaşıkları da üst üste bindirmeden diz, derin kapları ters çevir. Kollar ve filtre temiz, tuz ile parlatıcı tamken hâlâ kirli çıkıyorsa ya da su hiç ısınmıyorsa sıra rezistansa gelir — belirtiyi yaz, olası arızayı ve tahmini maliyeti ücretsiz öğren."
            }
          },
          {
            "@type": "Question",
            "name": "Buzdolabı ses yapıyor, gürültüsü arttı — önce neye bakmalıyım?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Önce dolabın dengesini ayarla: ön ayakları çevirerek hafif arkaya yatır ve sallanmadığından emin ol — gürültü şikâyetinin en sık sebebi dengesiz duruştur. Sonra teması kes; dolabı duvardan ve yan eşyalardan 5-10 cm uzaklaştır, üstünde duran şişe ve kutuları al, eğik zeminde ayaklarına takoz koy. Mırıltı, fokurtu ve no-frost modellerde hafif fan sesi normaldir; onları kovalamana gerek yok. Denge ve temas düzeltildiği hâlde gürültü sürüyorsa, sert metalik vuruntu geliyorsa ya da tiz bir çığlık duyulup dolap soğutmuyorsa sıra kompresör askı lastiklerine ve no-frost fan motoruna gelir — belirtiyi yaz, olası arızayı ve tahmini maliyeti ücretsiz öğren."
            }
          }
        ]
