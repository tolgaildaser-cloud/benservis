          {
            "@type": "Question",
            "name": "Teşhis için ücret ödüyor muyum?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Hayır, tamamen ücretsiz. Cihazını ve belirtiyi yaz; olası arızayı ve tahmini maliyeti anında öğren."
            }
          },
          {
            "@type": "Question",
            "name": "Sonuçtaki fiyat kesin mi?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Tahminidir; parça ve işçilik dahil bir aralık verir. Kesin fiyat, yerinde tespitte netleşir."
            }
          },
          {
            "@type": "Question",
            "name": "Çamaşır makinesi santrifüj sırasında çok ses yapıyor ve titriyor, önce neye bakmalıyım?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Önce makinenin dengesine bak: dört ayağın da yere tam bastığından ve makinenin elle itince oynamadığından emin ol, gerekiyorsa ayakları ayarlayıp kilit somunlarını sabitle. Ses taşınmadan sonra başladıysa arkadaki nakliye vidaları sökülmemiş olabilir; yükü de dengeli dağıt, tek bir ağır parça tamburu savurur. Makine düz zeminde, dengeli yükle ve vidaları sökülmüş hâldeyken hâlâ gürültülüyse rulman ya da amortisör yorulmuş olabilir — belirtiyi yaz, olası arızayı ve tahmini maliyeti ücretsiz öğren."
            }
          },
          {
            "@type": "Question",
            "name": "Bulaşıklar yıkamadan sonra kirli çıkıyor, önce neye bakmalıyım?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Önce alt ve üst püskürtme kollarını çıkar; deliklerini ince bir fırçayla aç, taktıktan sonra serbestçe döndüğünü kontrol et — sorun çoğu zaman buradadır. Tabandaki filtreyi de yıka, tuz ve parlatıcı seviyesine bak. Kollar ve filtre temizken bulaşıklar hâlâ kirli çıkıyorsa su yeterince ısınmıyor olabilir — belirtiyi yaz, olası arızayı ve tahmini maliyeti ücretsiz öğren."
            }
          },
          {
            "@type": "Question",
            "name": "Klima iç üniteden su damlatıyor, ne yapmalıyım?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Önce klimayı kapat — su elektronik karta veya prize ulaşırsa risklidir. Sonra iç ünitenin filtresini çıkarıp yıka ve tahliye hortumunun dışarı çıkan ucunda tıkanıklık ya da bükülme var mı bak; sorun genellikle tıkalı tahliye hattıdır. Filtre temiz, hortum açıkken damlama sürüyorsa belirtiyi yaz, olası arızayı ve tahmini maliyeti ücretsiz öğren."
            }
          }
        ]
